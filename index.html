<style>
/* Liquid Glass : verre dépoli, grands titres, capsules, barre d'onglets flottante. Clair et sombre automatiques. */
:root {
  color-scheme: light;
  --bg: #eef1fa;
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.82);
  --glass-edge: rgba(255, 255, 255, 0.85);
  --glass-shadow: 0 10px 32px rgba(36, 56, 110, 0.13), 0 1px 3px rgba(36, 56, 110, 0.08);
  --surface: var(--glass);
  --surface-2: rgba(120, 124, 150, 0.14);
  --fg: #1c1c1f;
  --muted: #6a6c78;
  --line: rgba(60, 60, 80, 0.14);
  --ink: #1c1c1f;
  --on-ink: #ffffff;
  --scrim: rgba(20, 24, 40, 0.34);
  --accent: #0a7aff;
  --accent-soft: rgba(10, 122, 255, 0.13);
  --paint: #0a7aff;
  --c60: #ff9f0a; --on60: #2b1700; --t60: rgba(255, 159, 10, 0.17);
  --c70: #0a84ff; --on70: #ffffff; --t70: rgba(10, 132, 255, 0.15);
  --cnf: #ff453a; --onnf: #ffffff; --tnf: rgba(255, 69, 58, 0.14);
  --warn-bg: rgba(255, 214, 10, 0.3); --warn-fg: #4d3600; --warn-line: rgba(255, 214, 10, 0.7); --warn-mark: #ffd60a; --on-mark: #1c1c1f;
  --plate-bg: #ffffff; --plate-fg: #101418; --plate-blue: #0a3d91; --plate-line: rgba(0, 0, 0, 0.22);
  --danger-text: #d70015;
  --sign: rgba(120, 124, 150, 0.14);
  --blob1: #8db8ff; --blob2: #ffc59a; --blob3: #d2b8ff;
  --bg-grad: linear-gradient(165deg, #e2ecff 0%, #efe8ff 48%, #ffeedd 100%);
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0c12;
    --glass: rgba(48, 50, 66, 0.52);
    --glass-strong: rgba(44, 46, 60, 0.82);
    --glass-edge: rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 10px 32px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.4);
    --surface-2: rgba(160, 164, 190, 0.18);
    --fg: #f5f5f8; --muted: #a2a4b2; --line: rgba(255, 255, 255, 0.12);
    --ink: #f5f5f8; --on-ink: #101014; --scrim: rgba(0, 0, 0, 0.55);
    --accent: #3d95ff; --accent-soft: rgba(61, 149, 255, 0.2); --paint: #6cb0ff;
    --c60: #ffa726; --on60: #2b1700; --t60: rgba(255, 167, 38, 0.2);
    --c70: #3d95ff; --on70: #ffffff; --t70: rgba(61, 149, 255, 0.2);
    --cnf: #ff5a4f; --onnf: #ffffff; --tnf: rgba(255, 90, 79, 0.2);
    --warn-bg: rgba(255, 214, 10, 0.22); --warn-fg: #ffe27a; --warn-line: rgba(255, 214, 10, 0.5); --warn-mark: #ffd60a; --on-mark: #1c1c1f;
    --plate-line: rgba(255, 255, 255, 0.3);
    --danger-text: #ff8a80; --sign: rgba(170, 174, 200, 0.18);
    --blob1: #1f4fb8; --blob2: #a14a1d; --blob3: #5b34a8;
    --bg-grad: linear-gradient(165deg, #0b1228 0%, #15112b 50%, #231411 100%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c12;
  --glass: rgba(48, 50, 66, 0.52);
  --glass-strong: rgba(44, 46, 60, 0.82);
  --glass-edge: rgba(255, 255, 255, 0.14);
  --glass-shadow: 0 10px 32px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.4);
  --surface-2: rgba(160, 164, 190, 0.18);
  --fg: #f5f5f8; --muted: #a2a4b2; --line: rgba(255, 255, 255, 0.12);
  --ink: #f5f5f8; --on-ink: #101014; --scrim: rgba(0, 0, 0, 0.55);
  --accent: #3d95ff; --accent-soft: rgba(61, 149, 255, 0.2); --paint: #6cb0ff;
  --c60: #ffa726; --on60: #2b1700; --t60: rgba(255, 167, 38, 0.2);
  --c70: #3d95ff; --on70: #ffffff; --t70: rgba(61, 149, 255, 0.2);
  --cnf: #ff5a4f; --onnf: #ffffff; --tnf: rgba(255, 90, 79, 0.2);
  --warn-bg: rgba(255, 214, 10, 0.22); --warn-fg: #ffe27a; --warn-line: rgba(255, 214, 10, 0.5); --warn-mark: #ffd60a; --on-mark: #1c1c1f;
  --plate-line: rgba(255, 255, 255, 0.3);
  --danger-text: #ff8a80; --sign: rgba(170, 174, 200, 0.18);
  --blob1: #1f4fb8; --blob2: #a14a1d; --blob3: #5b34a8;
  --bg-grad: linear-gradient(165deg, #0b1228 0%, #15112b 50%, #231411 100%);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; min-height: 100vh; background: transparent; color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
/* Fond : dégradé fixe avec trois halos flous que le verre vient diffracter */
body::before { content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -2; background: var(--bg-grad); }
body::after { content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(260px 260px at 8% 14%, var(--blob1) 0, transparent 70%),
    radial-gradient(240px 240px at 96% 46%, var(--blob2) 0, transparent 70%),
    radial-gradient(260px 260px at 20% 92%, var(--blob3) 0, transparent 70%);
  opacity: 0.6; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.in { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Le verre */
.glass, .car, .panel, .stat, .report, .rv__data, .code, .cal__d--has, .tools input, .field input, .count, .share-btn, .chip, .pill, .tag { -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); }
.car, .panel, .stat, .report, .rv__data, .code, .pill { background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-edge); }

/* En-tête : grand titre, un bouton de verre rond et une pastille de compte */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top .in { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 14px 8px; }
.brand { margin: 0; min-width: 0; font-weight: 800; font-size: 29px; line-height: 1.05; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-r { display: flex; align-items: center; gap: 8px; flex: none; }
.count { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.share-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); color: var(--accent); }
.share-btn.on { color: #fff; background: var(--accent); border-color: transparent; }
.dot { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border: 2px solid var(--bg); background: #30d158; border-radius: 50%; }
.dot.busy { background: var(--c60); }
.dot.err { background: var(--cnf); }
.main .in { padding-block: 10px calc(112px + env(safe-area-inset-bottom, 0px)); }

/* Boutons */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 18px; border: 0; border-radius: 26px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px; line-height: 1.1; text-align: center; transition: transform 0.15s var(--ease), opacity 0.15s; }
.btn--primary { min-height: 58px; border-radius: 29px; font-size: 18px; background: linear-gradient(180deg, #3a9bff, #0a7aff); box-shadow: 0 10px 24px rgba(10, 122, 255, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.45); }
.btn--ghost { background: var(--glass); color: var(--accent); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
.btn--danger { background: var(--glass); border: 1px solid var(--glass-edge); color: var(--danger-text); }
.btn--danger-solid { background: var(--cnf); color: var(--onnf); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn:active, .chip:active, .tab:active { transform: scale(0.97); }
.stack { display: grid; gap: 10px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Panneaux d'import */
.panel { margin-top: 14px; padding: 16px; display: grid; gap: 10px; border-radius: 24px; }
.panel p { margin: 0; }
.panel .big { font-weight: 700; font-size: 17px; }
.panel .warn-text { color: var(--danger-text); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #5ab0ff, var(--accent)); width: 0; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.3s; } }
.sum { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 4px 11px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); font-weight: 600; font-size: 13px; }
.tag--warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.tag--st { margin-left: auto; }

/* Recherche et filtres */
.tools { display: grid; gap: 10px; margin-top: 14px; }
.tools input, .field input { width: 100%; height: 48px; padding: 0 16px; border: 1px solid var(--glass-edge); border-radius: 24px; background: var(--glass); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06); font-size: 16px; }
.tools input::placeholder, .field input::placeholder { color: var(--muted); }
.field input { border-radius: 14px; background: var(--glass-strong); }
.tools input:focus, .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 38px; padding: 0 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); font-weight: 600; font-size: 14px; transition: transform 0.15s var(--ease); }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(10, 122, 255, 0.32); }
.chip--warn[aria-pressed="false"] { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }

.h2 { margin: 0 0 12px; font-weight: 800; font-size: 28px; line-height: 1.08; letter-spacing: -0.025em; }
.note { margin: 0; padding: 14px 2px; color: var(--muted); font-size: 16px; }
.legend { margin: 0; color: var(--muted); font-size: 15px; }
.legend b { color: var(--fg); font-family: var(--font-mono); }
.block { display: grid; gap: 12px; }
.sep { margin-top: 26px; padding-top: 20px; display: grid; gap: 10px; border-top: 1px solid var(--line); }

/* Compteurs */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 11px 4px 10px; border-radius: 20px; }
.stat b { font-size: 30px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 600; color: var(--muted); }
.stat--60 b { color: var(--c60); }
.stat--70 b { color: var(--c70); }
.stat--nf b { color: var(--cnf); }

/* Une voiture = une carte de verre */
.list { display: grid; gap: 12px; margin-top: 14px; }
.car { display: grid; gap: 12px; padding: 14px; border-radius: 26px; transition: background 0.25s; }
.car[data-st="60"] { background: linear-gradient(180deg, var(--t60), var(--glass) 70%); border-color: rgba(255, 159, 10, 0.45); }
.car[data-st="70"] { background: linear-gradient(180deg, var(--t70), var(--glass) 70%); border-color: rgba(10, 132, 255, 0.45); }
.car[data-st="nf"] { background: linear-gradient(180deg, var(--tnf), var(--glass) 70%); border-color: rgba(255, 69, 58, 0.45); }
.hd { display: flex; align-items: center; gap: 12px; }
.bay { flex: none; padding: 6px 13px; border-radius: 999px; background: var(--accent-soft); color: var(--paint); font-weight: 800; font-size: 21px; line-height: 1.1; letter-spacing: -0.01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bay--long { font-size: 14px; white-space: normal; overflow-wrap: anywhere; max-width: 110px; line-height: 1.15; border-radius: 16px; padding: 6px 11px; }
.bay--none { background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 16px; }
.nm { flex: 1; min-width: 0; display: grid; gap: 1px; }
.name { font-weight: 700; font-size: 17px; line-height: 1.2; overflow-wrap: break-word; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; font-weight: 500; }
.sub--todo { font-weight: 700; background: var(--warn-bg); color: var(--warn-fg); justify-self: start; padding: 1px 9px; border-radius: 999px; }
.icon-btn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 18px; }
.ids { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }

/* Plaque d'immatriculation */
.plate { display: inline-flex; align-items: stretch; height: 34px; border-radius: 8px; background: var(--plate-bg); overflow: hidden; box-shadow: 0 0 0 1px var(--plate-line), 0 2px 6px rgba(0, 0, 0, 0.12); }
.plate__eu { display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 21px; padding: 3px 0 2px; background: var(--plate-blue); color: #fff; }
.plate__eu svg { width: 13px; height: 13px; }
.plate__eu b { font: 700 9px/1 var(--font-body); }
.plate__txt { display: flex; align-items: center; padding: 0 10px; font-family: var(--font-body); font-weight: 700; font-size: 21px; letter-spacing: 0.07em; color: var(--plate-fg); white-space: nowrap; }
.plate__rg { width: 11px; background: var(--plate-blue); }
.noplate { display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1.5px dashed var(--muted); border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 600; }

.vin { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.55; }
.vin__lbl { font-family: var(--font-body); font-weight: 700; font-size: 12px; margin-right: 6px; color: var(--fg); }
.vin b { font-weight: 700; font-size: 15px; color: var(--fg); }
.vin__miss { font-family: var(--font-body); color: var(--danger-text); font-weight: 700; font-size: 14px; }
.uc { position: relative; display: inline-block; margin: 0 1px; padding: 0 4px; border: 0; border-radius: 5px; background: var(--warn-mark); color: var(--on-mark); font: inherit; font-weight: 700; }
.uc::after { content: ""; position: absolute; top: -9px; bottom: -9px; left: -3px; right: -3px; }
.vwarn { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 16px; font-weight: 600; font-size: 14px; }
.vwarn span { flex: 1 1 170px; min-width: 0; }
.vwarn button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--warn-mark); color: #1c1c1f; font-weight: 700; font-size: 14px; }
.vflag { display: inline-block; justify-self: start; padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); font-weight: 700; font-size: 12px; }

/* Choix : trois capsules de verre, la sélection s'allume en couleur */
.picks { display: grid; grid-template-columns: 1fr 1fr 1.35fr; gap: 8px; align-items: stretch; }
.pick { position: relative; display: flex; align-items: baseline; justify-content: center; gap: 3px; min-height: 52px; padding: 0 8px; border: 1px solid var(--glass-edge); border-radius: 26px; background: var(--sign); color: var(--fg); font-weight: 700; font-size: 20px; line-height: 52px; letter-spacing: -0.01em; transition: transform 0.15s var(--ease), background 0.2s, box-shadow 0.2s; }
.pick > span, .pick small { align-self: center; }
.pick small { font-size: 13px; font-weight: 600; opacity: 0.8; }
.pick--nf { font-size: 16px; white-space: nowrap; }
.pick:active { transform: scale(0.95); }
.pick[aria-pressed="true"] { border-color: transparent; }
.pick--60[aria-pressed="true"] { background: linear-gradient(180deg, #ffb940, var(--c60)); color: var(--on60); box-shadow: 0 8px 20px rgba(255, 159, 10, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.55); }
.pick--70[aria-pressed="true"] { background: linear-gradient(180deg, #4aa3ff, var(--c70)); color: var(--on70); box-shadow: 0 8px 20px rgba(10, 132, 255, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.45); }
.pick--nf[aria-pressed="true"] { background: linear-gradient(180deg, #ff6b61, var(--cnf)); color: var(--onnf); box-shadow: 0 8px 20px rgba(255, 69, 58, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.pick[aria-pressed="true"]::after { content: "\2713"; position: absolute; top: -5px; right: -3px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--fg); color: var(--bg); font: 800 12px/1 var(--font-body); line-height: 22px; }

/* À changer */
.pills { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.pill { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 14px 10px; border-radius: 24px; font-weight: 700; font-size: 18px; line-height: 1; border: 0; }
.pill b { font-size: 42px; letter-spacing: -0.03em; }
.pill--60 { background: linear-gradient(180deg, #ffb940, var(--c60)); color: var(--on60); box-shadow: 0 10px 24px rgba(255, 159, 10, 0.38); }
.pill--70 { background: linear-gradient(180deg, #4aa3ff, var(--c70)); color: var(--on70); box-shadow: 0 10px 24px rgba(10, 132, 255, 0.38); }
.badge { flex: none; display: flex; align-items: baseline; gap: 2px; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 24px; line-height: 1.15; white-space: nowrap; letter-spacing: -0.02em; }
.badge small { font-size: 13px; font-weight: 700; }
.badge--60 { background: var(--c60); color: var(--on60); }
.badge--70 { background: var(--c70); color: var(--on70); }

/* État vide */
.empty { display: grid; gap: 14px; margin-top: 6px; }
.empty p { margin: 0; color: var(--muted); font-size: 16px; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; font-size: 16px; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 16px; }
.example { position: relative; margin-top: 14px; pointer-events: none; }
.example__tag { position: absolute; top: -10px; right: 14px; z-index: 1; padding: 3px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; }

/* Texte final */
.report { width: 100%; padding: 14px; border-radius: 20px; color: var(--fg); font-family: var(--font-mono); font-weight: 500; font-size: 14px; line-height: 1.8; white-space: pre; overflow-x: auto; resize: none; }

/* Barre d'onglets flottante en verre */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.nav .in { pointer-events: auto; max-width: 560px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 6px; border-radius: 34px; background: var(--glass-strong); border: 1px solid var(--glass-edge); box-shadow: 0 14px 40px rgba(20, 30, 70, 0.22), inset 0 1px 0 var(--glass-edge); -webkit-backdrop-filter: blur(30px) saturate(190%); backdrop-filter: blur(30px) saturate(190%); }
.tab { position: relative; min-height: 56px; padding: 7px 1px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 28px; background: transparent; color: var(--muted); font-weight: 600; font-size: 10.5px; letter-spacing: 0; transition: background 0.25s var(--ease), color 0.25s, transform 0.15s var(--ease); }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.tab__n { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--cnf); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }

/* Fiches : feuille de verre qui monte du bas */
.scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 640px; max-height: 92%; margin: 0 auto; overflow-y: auto; display: grid; gap: 14px; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: var(--glass-strong); border: 1px solid var(--glass-edge); border-bottom: 0; border-radius: 34px 34px 0 0; box-shadow: 0 -12px 50px rgba(0, 0, 0, 0.25); -webkit-backdrop-filter: blur(36px) saturate(190%); backdrop-filter: blur(36px) saturate(190%); }
.sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--surface-2); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-weight: 600; font-size: 14px; color: var(--muted); }
.field .mono { font-family: var(--font-mono); letter-spacing: 0.04em; }
.field small { color: var(--muted); font-size: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form-error { margin: 0; color: var(--danger-text); font-weight: 700; }
.form-error:empty { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 28px); padding: 12px 20px; border-radius: 999px; background: var(--glass-strong); color: var(--fg); border: 1px solid var(--glass-edge); box-shadow: 0 12px 34px rgba(0, 0, 0, 0.25); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); font-weight: 600; text-align: center; }
.code { padding: 14px; text-align: center; border-radius: 18px; font-family: var(--font-mono); font-weight: 600; font-size: 24px; letter-spacing: 0.08em; user-select: all; -webkit-user-select: all; }

/* Historique */
.cal { display: grid; gap: 12px; }
.cal__bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal__bar .h2 { margin: 0; text-transform: capitalize; font-size: 26px; }
.cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal__dow { text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; }
.cal__d { position: relative; aspect-ratio: 1 / 1; min-height: 44px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 50%; background: transparent; color: var(--muted); font-weight: 600; font-size: 17px; }
.cal__d--has { background: var(--glass); border-color: var(--glass-edge); color: var(--fg); box-shadow: var(--glass-shadow); }
.cal__d--today { border-color: var(--accent); color: var(--accent); }
.cal__d--has.cal__d--today { background: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(10, 122, 255, 0.4); }
.cal__d--has.cal__d--today small { color: rgba(255, 255, 255, 0.85); }
.cal__d small { position: absolute; bottom: 5px; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 9px; color: var(--muted); }
.cal__d--blank { visibility: hidden; }

/* Comparaison avec la capture */
.rv { display: block; }
.rv__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 0 12px; }
.rv__top b { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
.rv__body { display: grid; gap: 14px; align-content: start; }
.rv__lbl { margin: 0 0 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.rv__shot { width: 100%; display: block; border-radius: 20px; border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); background: #fff; }
.rv__noshot { padding: 18px; border: 1.5px dashed var(--muted); border-radius: 20px; color: var(--muted); text-align: center; }
.rv__data { display: grid; gap: 10px; padding: 16px; border-radius: 24px; }
.rv__data .plate, .rv__data .noplate { justify-self: start; }
.rv__name { font-weight: 700; font-size: 19px; letter-spacing: -0.01em; }
.rv__vin { font-family: var(--font-mono); font-weight: 600; font-size: 22px; letter-spacing: 0.04em; line-height: 1.5; overflow-wrap: anywhere; }
.rv__vin b { font-weight: 700; color: var(--fg); }
.rv__vin button { border: 0; border-bottom: 2px dotted var(--muted); background: transparent; padding: 0 1px; font: inherit; color: inherit; }
.rv__vin button.on { background: var(--warn-mark); color: var(--on-mark); border-bottom-color: transparent; border-radius: 5px; }
.rv__hint { margin: 0; color: var(--muted); font-size: 13px; }
.rv__foot { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.rv__foot .full { grid-column: 1 / -1; }

/* ---- Finitions : ressorts, titre compact, barre rétractable, annuler ---- */
@keyframes pop { 0% { transform: scale(0.9); } 55% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes rise { 0% { transform: translateY(100%); } 70% { transform: translateY(-1.5%); } 100% { transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastin { 0% { opacity: 0; transform: translate(-50%, 14px) scale(0.92); } 60% { transform: translate(-50%, -2px) scale(1.02); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@media (prefers-reduced-motion: no-preference) {
  .pick[aria-pressed="true"] { animation: pop 0.38s var(--ease); }
  .pick[aria-pressed="true"]::after { animation: pop 0.45s var(--ease); }
  .sheet { animation: rise 0.45s cubic-bezier(0.2, 0.9, 0.25, 1.05); }
  .scrim { animation: fade 0.25s; }
  .toast { animation: toastin 0.35s var(--ease); }
  .car.settle { animation: pop 0.4s var(--ease); }
}
.top { transition: background 0.25s, box-shadow 0.25s; }
.top .in { position: relative; transition: padding 0.25s var(--ease); }
.brand { transition: font-size 0.25s var(--ease), left 0.25s; }
.top.compact { background: var(--glass-strong); -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); box-shadow: 0 1px 0 var(--line); }
.top.compact .in { padding-block: 8px; }
.top.compact .brand { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; letter-spacing: -0.01em; overflow: visible; }
.top.compact .count { opacity: 0; pointer-events: none; }
.count { transition: opacity 0.2s; }
.nav .in { transition: padding 0.25s var(--ease), border-radius 0.25s; }
.nav.min .in { padding: 4px; }
.nav.min .tab { min-height: 44px; padding: 4px 1px; }
.nav.min .tab > span:not(.tab__n) { display: none; }
.nav.min .tab__n { top: 1px; }
.toast { display: flex; align-items: center; gap: 14px; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 15px; padding: 4px 2px; }
.srch { display: flex; gap: 8px; align-items: center; }
.srch__btn { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 16px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--accent); font-weight: 600; font-size: 14px; }
.tools.closed #q { display: none; }

.ob { display: grid; gap: 14px; text-align: center; padding-top: 6px; }

.ob__dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); }
.ob__dots i.on { background: var(--accent); }

<label id="hpt" aria-hidden="true" style="position:fixed;left:-99px;top:0;opacity:0;pointer-events:none"><input type="checkbox" switch tabindex="-1"></label>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  'use strict';

  var KEY = 'controle-batteries-v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  };
  var plural = function (n, one, many) { return n > 1 ? many : one; };
  var clean = function (s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); };
  var uid = function () { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); };

  var ICON_EDIT = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  var EU = (function () {
    var s = '<svg viewBox="0 0 14 14" aria-hidden="true">', i, a;
    for (i = 0; i < 12; i++) {
      a = i * Math.PI / 6;
      s += '<circle cx="' + (7 + 5.2 * Math.sin(a)).toFixed(2) + '" cy="' + (7 - 5.2 * Math.cos(a)).toFixed(2) + '" r="0.9" fill="#fc0"/>';
    }
    return s + '</svg>';
  })();

/* ---------- Lecture du texte d'une capture ---------- */
  var BRANDS = ['ABARTH','ALFA ROMEO','AUDI','BMW','BYD','CHRYSLER','CITROEN','CITROËN','CUPRA','DACIA','DS','FIAT','FORD','HONDA','HYUNDAI','IVECO','JEEP','KIA','LANCIA','LAND ROVER','MASERATI','LEXUS','MAN','MAZDA','MERCEDES-BENZ','MERCEDES','MG','MINI','MITSUBISHI','NISSAN','OPEL','PEUGEOT','POLESTAR','PORSCHE','RENAULT','SEAT','SKODA','SMART','SUZUKI','TESLA','TOYOTA','VAUXHALL','VOLKSWAGEN','VOLVO','VW'].sort(function (a, b) { return b.length - a.length; });
  var LETFIX = { '0': 'O', '1': 'I', '5': 'S', '8': 'B', '2': 'Z', '6': 'G' };
  var DIGFIX = { 'O': '0', 'Q': '0', 'I': '1', 'L': '1', 'S': '5', 'B': '8', 'Z': '2', 'G': '6', 'D': '0' };
  function fixL(s) { return s.replace(/[0-9]/g, function (c) { return LETFIX[c] || c; }); }
  function fixD(s) { return s.replace(/[A-Z]/g, function (c) { return DIGFIX[c] || c; }); }
  function toTitle(s) { return s.toLowerCase().replace(/(^|[\s\-])([a-zà-ÿ])/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function lev(a, b) {
    var m = a.length, n = b.length, i, j, prev = [], cur;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur = [i];
      for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function median(a) { var s = a.slice().sort(function (x, y) { return x - y; }); return s[Math.floor(s.length / 2)]; }

  var PLATE_STRICT = /\b([A-Z]{2})[\s\-–.]?(\d{3})[\s\-–.]?([A-Z]{2})\b/;
  var PLATE_STRICT_G = /\b[A-Z]{2}[\s\-–.]?\d{3}[\s\-–.]?[A-Z]{2}\b/g;

  function vinIn(t) {
    var toks = String(t).toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean), best = '', i, n;
    for (i = 0; i < toks.length; i++) {
      n = normVin(toks[i]);
      if (n.length >= 16 && n.length <= 18 && (n.match(/\d/g) || []).length >= 4 && /[A-Z]/.test(n)) {
        if (n.length === 17) return n;
        if (!best) best = n;
      }
    }
    if (best) return best;
    var j = normVin(t);
    return (j.length === 17 && (j.match(/\d/g) || []).length >= 4 && /[A-Z]/.test(j)) ? j : '';
  }

  function plateIn(t) {
    var u = String(t).toUpperCase().replace(/[A-Z0-9]{14,}/g, ' ');
    var m = u.match(PLATE_STRICT);
    if (m) return m[1] + ' ' + m[2] + ' ' + m[3];
    var re = /(?:^|[^A-Z0-9])([A-Z0-9]{2})[\s\-–.]([A-Z0-9]{3})[\s\-–.]([A-Z0-9]{2})(?![A-Z0-9])/g;
    while ((m = re.exec(u))) {
      var a = fixL(m[1]), b = fixD(m[2]), c = fixL(m[3]);
      if (/^[A-Z]{2}$/.test(a) && /^\d{3}$/.test(b) && /^[A-Z]{2}$/.test(c)) return a + ' ' + b + ' ' + c;
    }
    return '';
  }

  function stripKnown(t) {
    return String(t).replace(/[A-Za-z0-9]{14,}/g, ' ').replace(PLATE_STRICT_G, ' ');
  }
  function locIn(t) {
    var u = stripKnown(String(t).toUpperCase());
    var m = u.match(/\b([A-Z]{2,4})[\s\-–.]?(\d{1,3})\b/);
    if (!m || /^(VIN|VINS|OBT|PARC)$/.test(m[1])) return '';
    return m[1] + '-' + m[2];
  }
  function cleanModel(s) {
    s = String(s || '').replace(/[^A-Za-z0-9À-ÿ\s\-.\/+]/g, ' ').replace(/\s+/g, ' ').trim();
    if (s.length < 2 || !/[A-Za-z0-9]/.test(s)) return '';
    return s.slice(0, 30);
  }

  function brandIn(t) {
    var up = String(t).toUpperCase(), i, b, idx, before, after;
    for (i = 0; i < BRANDS.length; i++) {
      b = BRANDS[i];
      idx = up.indexOf(b);
      if (idx === -1) continue;
      before = idx === 0 ? ' ' : up.charAt(idx - 1);
      after = up.charAt(idx + b.length) || ' ';
      if (/[A-Z0-9]/.test(before) || /[A-Z0-9]/.test(after)) continue;
      return { brand: b, rest: clean(String(t).slice(idx + b.length)) };
    }
    var re = /[A-ZÉË]{4,}/g, m, lim;
    while ((m = re.exec(up))) {
      for (i = 0; i < BRANDS.length; i++) {
        b = BRANDS[i];
        if (b.length < 4 || b.indexOf(' ') !== -1) continue;
        lim = b.length >= 7 ? 2 : 1;
        if (Math.abs(b.length - m[0].length) <= lim && lev(m[0], b) <= lim) {
          return { brand: b, rest: clean(String(t).slice(m.index + m[0].length)) };
        }
      }
    }
    return null;
  }

  function getLines(data) {
    var src = (data && data.lines && data.lines.length) ? data.lines : [];
    if (!src.length && data && data.blocks) {
      data.blocks.forEach(function (b) {
        (b.paragraphs || []).forEach(function (p) { (p.lines || []).forEach(function (l) { src.push(l); }); });
      });
    }
    return src.map(function (l) {
      var b = l.bbox || {};
      var y0 = b.y0 || 0, y1 = b.y1 || 0;
      return { t: clean(l.text), x0: b.x0 || 0, x1: b.x1 || 0, y0: y0, y1: y1, cy: (y0 + y1) / 2 };
    }).filter(function (l) { return l.t; });
  }

  /* Une voiture = un VIN. Les autres infos (plaque, marque, modèle, emplacement) sont cherchées autour de lui. */
  function parseCaptures(lines, W) {
    var info = lines.map(function (l) { return { vin: vinIn(l.t), plate: plateIn(l.t) }; });
    var anchors = [];
    lines.forEach(function (l, i) { if (info[i].vin) anchors.push(i); });
    anchors.sort(function (a, b) { return lines[a].cy - lines[b].cy; });
    var sp = 0.2358 * W, k;
    if (anchors.length > 1) {
      var d = [];
      for (k = 1; k < anchors.length; k++) d.push(lines[anchors[k]].cy - lines[anchors[k - 1]].cy);
      sp = Math.min(0.4 * W, Math.max(0.12 * W, median(d)));
    }
    var used = {}, out = [];
    var byY = function (a, b) { return lines[a].cy - lines[b].cy; };

    function buildCard(idxs, vin, anchorLine) {
      var plate = '', bl = null, brand = '', rest = '', modele = '', locs = [], q, i, l;
      for (q = 0; q < idxs.length && !plate; q++) if (info[idxs[q]].plate) plate = info[idxs[q]].plate;
      for (q = 0; q < idxs.length && !bl; q++) {
        i = idxs[q];
        if (info[i].vin) continue;
        var bi = brandIn(lines[i].t);
        if (bi) { bl = lines[i]; brand = bi.brand; rest = bi.rest; }
      }
      if (bl) {
        modele = cleanModel(stripKnown(rest));
        if (!modele) {
          var bestD = 1e9;
          idxs.forEach(function (j) {
            var m = lines[j];
            if (m === bl || info[j].vin || info[j].plate) return;
            if (Math.abs(m.x0 - bl.x0) > 0.05 * W) return;
            var dy = m.cy - bl.cy;
            if (dy <= 0 || dy > 0.4 * sp || dy >= bestD) return;
            var cm = cleanModel(stripKnown(m.t));
            if (cm) { bestD = dy; modele = cm; }
          });
        }
      }
      for (q = 0; q < idxs.length; q++) {
        i = idxs[q]; l = lines[i];
        if (info[i].vin) continue;
        if (bl && Math.abs(l.x0 - bl.x0) <= 0.05 * W) continue;
        if (anchorLine && Math.abs(l.x0 - anchorLine.x0) <= 0.05 * W) continue;
        var lo = locIn(l.t);
        if (lo) locs.push(lo);
      }
      return {
        vin: vin, plaque: plate,
        marque: brand ? (brand.length > 3 ? toTitle(brand) : brand) : '',
        modele: modele, emplacement: '', locs: locs,
        vinBox: (vin && anchorLine) ? { x0: anchorLine.x0, y0: anchorLine.y0, x1: anchorLine.x1, y1: anchorLine.y1 } : null
      };
    }

    anchors.forEach(function (ai) {
      var a = lines[ai], idxs = [];
      lines.forEach(function (l, i) {
        if (i === ai || used[i] || info[i].vin) return;
        if (l.cy > a.cy - 0.72 * sp && l.cy <= a.cy + 0.2 * sp) idxs.push(i);
      });
      idxs.forEach(function (i) { used[i] = 1; });
      used[ai] = 1;
      var cd = buildCard(idxs.sort(byY), info[ai].vin, a);
      cd.cardBox = { y0: a.cy - 0.72 * sp, y1: a.cy + 0.2 * sp };
      out.push(cd);
    });

    lines.forEach(function (l, i) {
      if (used[i] || !info[i].plate) return;
      var idxs = [];
      lines.forEach(function (m, j) {
        if (!used[j] && !info[j].vin && m.cy > l.cy - 0.3 * sp && m.cy <= l.cy + 0.7 * sp) idxs.push(j);
      });
      idxs.forEach(function (j) { used[j] = 1; });
      var cd2 = buildCard(idxs.sort(byY), '', l);
      cd2.cardBox = { y0: l.cy - 0.3 * sp, y1: l.cy + 0.7 * sp };
      out.push(cd2);
    });
    /* L'emplacement est celui dont le préfixe (GRO, ...) revient le plus souvent sur la capture. */
    var cnt = {}, dom = '', dn = 1, pf;
    out.forEach(function (c) {
      var seen = {};
      c.locs.forEach(function (x) { pf = x.split('-')[0]; if (!seen[pf]) { seen[pf] = 1; cnt[pf] = (cnt[pf] || 0) + 1; } });
    });
    for (pf in cnt) if (cnt[pf] > dn) { dn = cnt[pf]; dom = pf; }
    out.forEach(function (c) {
      var pickLoc = '';
      if (dom) c.locs.some(function (x) { if (x.split('-')[0] === dom) { pickLoc = x; return true; } return false; });
      c.emplacement = pickLoc || c.locs[0] || '';
      delete c.locs;
    });
    return out;
  }

  

  /* ---------- Données ---------- */
  function fix(c) {
    return {
      id: c.id || uid(),
      plaque: String(c.plaque || ''),
      marque: String(c.marque || ''),
      modele: String(c.modele || ''),
      vin: String(c.vin || ''),
      emp: String(c.emp || ''),
      st: (c.st === '60' || c.st === '70' || c.st === 'nf') ? c.st : '',
      ok: c.ok === undefined ? true : !!c.ok,
      img: typeof c.img === 'string' ? c.img : '',
      chk: !!c.chk,
      unc: Array.isArray(c.unc) ? c.unc.filter(function (n) { return typeof n === 'number'; }) : []
    };
  }
  var IKEY = 'controle-batteries-img-v1';
  function load() {
    var imgs = {};
    try { imgs = JSON.parse(localStorage.getItem(IKEY) || '{}') || {}; } catch (e) {}
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.cars)) return d.cars.map(function (c) { c.img = imgs[c.id] || ''; return fix(c); });
      }
    } catch (e) {}
    return [];
  }
  function save() {
    /* Les voitures sont enregistrées à part des images : si la place manque, seules les images sautent, jamais les voitures. */
    try { localStorage.setItem(KEY, JSON.stringify({ cars: cars.map(function (c) { var o = Object.assign({}, c); delete o.img; return o; }) })); } catch (e) {}
    try {
      var m = {};
      cars.forEach(function (c) { if (c.img) m[c.id] = c.img; });
      localStorage.setItem(IKEY, JSON.stringify(m));
    } catch (e) { try { localStorage.removeItem(IKEY); } catch (e2) {} }
    syncSoon();
  }

  function normVin(v) {
    return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/[OQ]/g, '0').replace(/I/g, '1');
  }
  function normPlate(p) {
    var s = String(p || '').toUpperCase().replace(/[‐‑–—_.]/g, '-').replace(/\s+/g, ' ').trim();
    if (!s || /^(N\/?A|AUCUNE?|NONE|NEANT|NÉANT|-+|\?+)$/.test(s)) return '';
    var m = s.match(/^([A-Z]{2})[\s-]?(\d{3})[\s-]?([A-Z]{2})$/);
    if (m) return m[1] + ' ' + m[2] + ' ' + m[3];
    return s.replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
  }
  var pk = function (p) { return String(p || '').replace(/\s/g, ''); };
  function findDup(c) {
    return cars.find(function (x) {
      return (c.vin && x.vin && x.vin === c.vin) || (c.plaque && x.plaque && pk(x.plaque) === pk(c.plaque));
    }) || null;
  }

  var collator = new Intl.Collator('fr', { numeric: true, sensitivity: 'base' });
  function sortCars(list) {
    return list.slice().sort(function (a, b) {
      if (!a.emp !== !b.emp) return a.emp ? -1 : 1;
      var r = collator.compare(a.emp, b.emp);
      if (r) return r;
      return collator.compare(a.plaque || a.vin, b.plaque || b.vin);
    });
  }
  var byId = function (id) { return cars.find(function (c) { return c.id === id; }); };
  var isChange = function (c) { return c.st === '60' || c.st === '70'; };

  /* ---------- Contrôles locaux sur le VIN ---------- */
  var TWIN = { 'S': '5', '5': 'S', 'B': '8', '8': 'B', 'Z': '2', '2': 'Z', 'G': '6', '6': 'G', 'D': '0', '0': 'D' };
  var YEARS = { A: 2010, B: 2011, C: 2012, D: 2013, E: 2014, F: 2015, G: 2016, H: 2017, J: 2018, K: 2019, L: 2020, M: 2021, N: 2022, P: 2023, R: 2024, S: 2025, T: 2026, V: 2027, W: 2028, X: 2029, Y: 2030 };
  var RECENT = 'KLMNPRSTV';
  function vinYear(vin) {
    var ch = String(vin || '').charAt(9);
    return (RECENT.indexOf(ch) !== -1 && YEARS[ch]) ? YEARS[ch] : 0;
  }
  function brandKey(b) { return String(b || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var KNOWN_WMI = ['VR3', 'VF3', 'VR7', 'VF7', 'VR1', 'VF1', 'VXK'];

  /* ---------- Lecture des captures, sur le téléphone ---------- */

  /* Prépare la capture : version en gris pour la lecture de la page, et garde l'image d'origine pour relire les VIN en pleine résolution. */
  async function prep(file) {
    var bmp = await createImageBitmap(file);
    var scale = Math.min(3, Math.max(0.5, 1500 / bmp.width));
    var w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0, w, h);
    var im = ctx.getImageData(0, 0, w, h), d = im.data, sum = 0, i, g;
    for (i = 0; i < d.length; i += 4) {
      g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = g;
      sum += g;
    }
    var inv = sum / (d.length / 4) < 110;
    if (inv) { for (i = 0; i < d.length; i += 4) { d[i] = d[i + 1] = d[i + 2] = 255 - d[i]; } }
    ctx.putImageData(im, 0, 0);
    return { cv: cv, W: w, bmp: bmp, scale: scale, inv: inv };
  }

  function otsu(hist, total) {
    var sum = 0, i, sB = 0, wB = 0, best = 0, thr = 128, wF, mB, mF, v;
    for (i = 0; i < 256; i++) sum += i * hist[i];
    for (i = 0; i < 256; i++) {
      wB += hist[i];
      if (!wB) continue;
      wF = total - wB;
      if (!wF) break;
      sB += i * hist[i];
      mB = sB / wB; mF = (sum - sB) / wF;
      v = wB * wF * (mB - mF) * (mB - mF);
      if (v > best) { best = v; thr = i; }

  }

  /* Découpe la ligne du VIN dans l'image d'origine, l'agrandit et augmente le contraste (variante v). */
  function makeCrop(src, box, v) {
    var sc = src.scale, bmp = src.bmp, b = 24;
    var padX = 14 / sc, padY = 8 / sc;
    var sx = Math.max(0, Math.floor(box.x0 / sc - padX)), sy = Math.max(0, Math.floor(box.y0 / sc - padY));
    var sw = Math.min(bmp.width - sx, Math.ceil((box.x1 - box.x0) / sc + 2 * padX));
    var sh = Math.min(bmp.height - sy, Math.ceil((box.y1 - box.y0) / sc + 2 * padY));
    if (sw < 12 || sh < 6) return null;
    var k = v.scale / sc;
    var ow = Math.max(8, Math.round(sw * k)), oh = Math.max(8, Math.round(sh * k));
    var out = document.createElement('canvas');
    out.width = ow + 2 * b; out.height = oh + 2 * b;
    var ctx = out.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, sx, sy, sw, sh, b, b, ow, oh);
    var im = ctx.getImageData(b, b, ow, oh), d = im.data, i, g, lo = 255, hi = 0, hist = [];
    for (i = 0; i < 256; i++) hist[i] = 0;
    for (i = 0; i < d.length; i += 4) {
      g = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      if (src.inv) g = 255 - g;
      d[i] = d[i + 1] = d[i + 2] = g;
      hist[g]++;
      if (g < lo) lo = g;
      if (g > hi) hi = g;
    }
    if (hi - lo >= 20) {
      var kk = 255 / (hi - lo), h2 = [];
      for (i = 0; i < 256; i++) h2[i] = 0;
      for (i = 0; i < d.length; i += 4) { g = Math.round((d[i] - lo) * kk); d[i] = d[i + 1] = d[i + 2] = g; h2[g]++; }
      if (v.bin) {
        var thr = otsu(h2, d.length / 4) * v.bin;
        for (i = 0; i < d.length; i += 4) { g = d[i] > thr ? 255 : 0; d[i] = d[i + 1] = d[i + 2] = g; }
      }
    }
    ctx.putImageData(im, b, b);
    return out;
  }

  /* Image de la voiture telle qu'elle apparaît sur la capture, pour comparer à l'œil. */
  function cardImage(src, box) {
    try {
      var sc = src.scale, bmp = src.bmp;
      var sy = Math.max(0, Math.floor(box.y0 / sc)), sh = Math.min(bmp.height - sy, Math.ceil((box.y1 - box.y0) / sc));
      if (sh < 20) return '';
      var ow = Math.min(bmp.width, 640), oh = Math.max(10, Math.round(sh * ow / bmp.width));
      var cv = document.createElement('canvas');
      cv.width = ow; cv.height = oh;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, sy, bmp.width, sh, 0, 0, ow, oh);
      return cv.toDataURL('image/jpeg', 0.62);
    } catch (e) { return ''; }
  }

  function vinFromText(t) {
    var parts = String(t || '').split(/\r?\n/), best = '', i, n;
    for (i = 0; i < parts.length; i++) {
      n = normVin(parts[i]);
      if (n.length >= 15 && n.length <= 19 && (!best || Math.abs(n.length - 17) < Math.abs(best.length - 17))) best = n;
    }
    return best || normVin(t);

  function hint(i, ch, fr) {

  /* Vote caractère par caractère entre plusieurs lectures (la lecture de la page compte moitié moins). Un caractère est sûr si au moins 75 % du poids est d'accord. */
  function vinVote(reads, ws, brand) {
    ws = ws || reads.map(function () { return 1; });
    var refs = reads.filter(function (r) { return r.length === 17; });
    var pool = [], pw = [];
    reads.forEach(function (r, k) {
      var x = r;
      if (r.length === 18 && refs.length) {
        var best = '', bd = 1e9, i, j, cand, d;
        for (i = 0; i < 18; i++) {
          cand = r.slice(0, i) + r.slice(i + 1);
          d = 0;

          if (d < bd) { bd = d; best = cand; }
        }
        if (bd <= 3 * refs.length) x = best;
      }
      if (x.length === 17) { pool.push(x); pw.push(ws[k]); }
    });
    if (!pool.length) return { vin: reads[0] || '', unc: [], chk: true, dis: [] };
    var total = 0, j;
    for (j = 0; j < pw.length; j++) total += pw[j];
    var fr = /^V[FR]/.test(pool[0]);
    var vin = '', unc = [], dis = [], i, ch, cand2, top, topN, score, bestS, tally, kinds;
    for (i = 0; i < 17; i++) {
      tally = {}; kinds = 0;
      for (j = 0; j < pool.length; j++) {
        ch = pool[j].charAt(i);
        if (!tally[ch]) kinds++;
        tally[ch] = (tally[ch] || 0) + pw[j];
      }
      top = ''; topN = 0; bestS = -1e9;
      for (cand2 in tally) {
        score = tally[cand2] * 10 + hint(i, cand2, fr);
        if (score > bestS) { bestS = score; top = cand2; topN = tally[cand2]; }
      }

    else if (a === 'h-prev') { hm.m--; if (hm.m < 0) { hm.m = 11; hm.y--; } renderHist(); }
    else if (a === 'h-next') { hm.m++; if (hm.m > 11) { hm.m = 0; hm.y++; } renderHist(); }
    else if (a === 'h-open') { hDay = t.dataset.k; hConfirmDel = false; renderHist(); window.scrollTo(0, 0); }
    else if (a === 'h-back') { hDay = null; hConfirmDel = false; renderHist(); window.scrollTo(0, 0); }
    else if (a === 'h-del') { hConfirmDel = true; renderHist(); }
    else if (a === 'h-del-cancel') { hConfirmDel = false; renderHist(); }
    else if (a === 'h-del-ok') { delDay(hDay); delete hist[hDay]; saveHist(); hDay = null; hConfirmDel = false; renderHist(); toast('Journ\u00e9e supprim\u00e9e'); }
    else if (a === 'h-copy') { copyReport('#hreport'); }
    else if (a === 'stop') { if (imp && imp.ctl) imp.ctl.abort(); }
    else if (a === 'dismiss-import') { imp = null; renderImport(); }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'car-form') return;
    e.preventDefault();
    var v = function (id) { return $('#' + id).value; };
    var data = {
      emp: clean(v('f-emp')),
      plaque: normPlate(v('f-plaque')),
      marque: clean(v('f-marque')),
      modele: clean(v('f-modele')),
      vin: normVin(v('f-vin'))
    };
    var err = $('#form-error');
    if (!data.emp && !data.plaque && !data.vin) {
      err.textContent = 'Renseigne au moins la plaque, le VIN ou l’emplacement.';
      return;
    }
    if (editingId) {
      var cur = byId(editingId);
      var vinChanged = data.vin !== cur.vin;
      Object.assign(cur, data);
      cur.ok = true;
      if (vinChanged) { cur.chk = data.vin.length > 0 && data.vin.length !== 17; cur.unc = []; }
    } else {
      if (findDup(data)) { err.textContent = 'Cette voiture est déjà dans la liste.'; return; }
      cars.push(fix(Object.assign({}, data, { st: '', ok: true, chk: data.vin.length > 0 && data.vin.length !== 17 })));
      toast('Voiture ajoutée');
    }
    save();
    closeSheet();
    renderAll();
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { query = e.target.value; renderList(); }
    else if (e.target.id === 'f-vin') {
      var val = e.target.value.toUpperCase().replace(/\s/g, '');
      if (val !== e.target.value) e.target.value = val;
      $('#vin-count').textContent = val.length + ' / 17 caractères. Les 8 derniers vont dans le texte.';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('#car-form')) closeSheet();
  });

  $('#btn-import').addEventListener('click', function () { $('#files').click(); });
  $('#files').addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = '';
    runImport(files);
  });

  $('#q').addEventListener('blur', function () { if (!this.value) $('#tools').classList.add('closed'); });
  /* Titre compact et barre d'onglets rétractable au défilement */
  (function () {
    var last = window.scrollY, top = document.querySelector('.top'), nav = document.querySelector('.nav'), tk = false;
    window.addEventListener('scroll', function () {
      if (tk) return; tk = true;
      requestAnimationFrame(function () {
        var y = window.scrollY;
        top.classList.toggle('compact', y > 46);
        if (y > last + 6 && y > 120) nav.classList.add('min');
        else if (y < last - 6 || y < 60) nav.classList.remove('min');
        last = y; tk = false;
      });
    }, { passive: true });
  })();
  /* Accueil de première ouverture */
  (function () {
    var KEY = 'atlas-onboard-v1', seen = false;
    try { seen = !!localStorage.getItem(KEY); } catch (e) {}
    if (seen || cars.length) return;
    var pages = [
      { ic: '<svg width="38" height="38" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.5h6.8L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>', h: 'Importe tes captures', p: 'Atlas lit la plaque, le VIN, le modèle et l’emplacement directement sur ton téléphone.' },
      { ic: '<svg width="38" height="38" viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="17" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="20.5" y="10.5" width="2" height="4" rx="1" fill="currentColor"/><path d="M8 12.5h6M11 9.5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>', h: '60, 70 ou introuvable', p: 'Un tap par voiture. Une erreur ? Touche « Annuler » dans la bulle.' },
      { ic: '<svg width="38" height="38" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>', h: 'Le texte, prêt à envoyer', p: 'Copie la liste finale, termine la journée, retrouve tout dans l’historique et partage avec ton pote.' }
    ], pi = 0;
    function draw() {
      var pg = pages[pi], dots = pages.map(function (_, i) { return '<i' + (i === pi ? ' class="on"' : '') + '></i>'; }).join('');
      $('#sheet-root').innerHTML = '<div class="scrim" data-action="ob-skip"></div><div class="sheet" role="dialog" aria-modal="true"><div class="ob"><div class="ob__ic">' + pg.ic + '</div><h2>' + pg.h + '</h2><p>' + pg.p + '</p><div class="ob__dots">' + dots + '</div><button type="button" class="btn btn--primary" data-action="ob-next">' + (pi === pages.length - 1 ? 'Commencer' : 'Suivant') + '</button></div></div>';
    }
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-action^="ob-"]'); if (!t) return;
      if (t.dataset.action === 'ob-next' && pi < pages.length - 1) { pi++; draw(); return; }
      $('#sheet-root').innerHTML = ''; try { localStorage.setItem(KEY, '1'); } catch (er) {}
    });
    draw();
  })();
  window.addEventListener('error', function (e) { toast('Erreur : ' + (e && e.message ? e.message : 'inconnue')); });

  /* ---------- Démarrage ---------- */
  renderAll();
  renderImport();
  shareInit();
})();
</script>
</body>
</html>
